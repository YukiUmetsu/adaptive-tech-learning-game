[project]
name = "adaptive-learn-ml"
version = "0.1.0"
description = "Local-first ML training, evaluation, and analysis for the adaptive learning game."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_learn_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
